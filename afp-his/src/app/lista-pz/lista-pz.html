<input
  [(ngModel)]="nomePaziente"
  pInputText
  type="text"
  (change)="PatientManager.filterByName(nomePaziente())"
>

<p> Nome Paziente: {{nomePaziente () || 'none'}} </p>
<p> Pazienti in Lista: {{ListaPz().length}} </p>
<hr>

<his-stato-api/>

<div
    class="flex flex-wrap flex-row gap-4 p-4"
>
    @for (pz of ListaPz(); track pz.braccialetto) {
    <his-card-pz [borderTop]="false" [paziente]="pz"/>
    <p-button (onClick)="editNomePaziente(pz.nome)" label="Modifica nome paziente"></p-button>
    }   @empty {
        <h1> Nessun paziente in attesa </h1>
    }
</div>
