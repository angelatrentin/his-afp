@let srv = SystemStatus.statoAPI().service;
@let db = SystemStatus.statoAPI().database;
@let uptime = SystemStatus.statoAPI().uptime;

<div
  class="justify-center w-full
  flex flex-row items-center gap-3"
>
  Service:
      <p-tag
        [severity]="srv == 'UP' ? 'success' : 'danger'"
        value="{{ srv }}"
      />

    Database:
      <p-tag
        [severity]="db === 'CONNECTED' ? 'success' : 'danger'"
        value="{{ db }}"
      />
    
    Uptime:
      <p-tag
        [severity]="uptime >0 ? 'success' : 'danger'"
        value="{{ uptime }}"
      />
    
</div>

<div
  class="justify-center w-full
  flex flex-col items-center mt-4"
>
      <p-button class="flex-col" (onClick)="SystemStatus.fetchStatoAPI()">
      Refresh Status
      </p-button>
</div>
