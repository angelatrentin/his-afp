<header
    class="flex flex-row items-center shadow-md backdrop-opacity-5"
>
    <div
        class="flex items-center justify-center p-1">
        <img class="w-40" alt="LogoAsuit" src="logo-asuit.svg"/>
    </div>

    <div
        class="pl-1"
    >
        <h1 class="text-4xl font-bold text-primary">{{reparto}}</h1>
        <p class="text-md text-gray-800 dark:text-gray-400"> {{struttura}}</p>
    </div>

    <p-divider layout="vertical"/>
    <div class="border-l h-10 mx-1"></div>

    <nav
        class="flex flex-row items-center gap-3 pl-4"
    >
        <p-button
        label="Lista PZ"
        routerLink="/lista-pz"
        variant="outlined"
        />
        <p-button
            label="Accettazione PZ"
            routerLink="/accettazione-pz"
            variant="outlined"
        />
        <p-button
            label="Stato Servizi"
            routerLink="/stato-servizi"
            variant="outlined"
        />
    </nav>

    <div
        class="ml-auto mr-4"
    >
        <his-darkmode-selector/>
    </div>

</header>
